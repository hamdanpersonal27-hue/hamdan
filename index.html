<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accurate Digital Watch</title>
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        .watch-container {
            background-color: #000;
            padding: 30px 50px;
            border: 5px solid #222;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            text-align: center;
        }
        .time-display {
            color: #00ffcc;
            font-size: 64px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.7);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="watch-container">
        <div id="clock" class="time-display">00:00:00 AM</div>
    </div>

    <script>
        function updateWatchTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ampm = hours >= 12 ? 'PM' : 'AM';

            // Convert to 12-hour format
            hours = hours % 12;
            hours = hours ? hours : 12; // The hour '0' should be '12'

            // Pad single digits with a leading zero
            hours = String(hours).padStart(2, '0');
            minutes = String(minutes).padStart(2, '0');
            seconds = String(seconds).padStart(2, '0');

            // Render precise time string
            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds} ${ampm}`;
        }

        // Keep the clock accurately updating every second
        setInterval(updateWatchTime, 1000);
        
        // Execute immediately so there's no layout flash on load
        updateWatchTime();
    </script>

</body>
</html>
